name: Generate GitHub Streak Image

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate GitHub Streak Stats
        run: |
          curl -L -o streak.png "https://streak-stats.demolab.com?user=AI-Vijay&theme=tokyonight"

      - name: Commit Streak Image
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak.png

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "⚡ Update GitHub streak image"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
